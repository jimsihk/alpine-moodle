name: Build and test PR

on:
  pull_request:
    branches: ["dev"]
    paths-ignore:
      - README.md

jobs:
  build-and-test-pr:
    runs-on: ubuntu-latest
    steps:
      - uses: step-security/harden-runner@v2
        with:
          egress-policy: audit

      - name: Checkout
        uses: actions/checkout@v4

      - name: Prepare Meta Data
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: |
            ${{ github.repository }}
          tags: |
            type=sha

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and Test
        run: |
          echo '###############################'
          echo "Test - build with plugin list and installing Moodle..."
          export TEST_IMAGE_NAME=${{ steps.meta.outputs.tags }}
          export ARG_MOODLE_PLUGIN_LIST=report_benchmark
          docker compose --file docker-compose.test.yml up --exit-code-from sut -t 10
          docker compose --file docker-compose.test.yml down --remove-orphans

          echo '###############################'
          echo "Test - Moodle update and plugin installation..."
          export TEST_IMAGE_NAME=${{ github.repository }}:latest
          docker compose --file docker-compose.test.yml up --exit-code-from sut -t 10
          export TEST_IMAGE_NAME=${{ steps.meta.outputs.tags }}
          export AUTO_UPDATE_MOODLE=true
          export UPDATE_MOODLE_CODE=true
          docker compose --file docker-compose.test.yml up --exit-code-from sut -t 10
          docker compose --file docker-compose.test.yml down --remove-orphans
          unset AUTO_UPDATE_MOODLE UPDATE_MOODLE_CODE

          echo '###############################'
          echo "Test (slim) - build with plugin list and installing Moodle..."
          export TEST_IMAGE_NAME=${{ steps.meta.outputs.tags }}-slim
          export ARG_ENABLE_GIT_CLONE=false
          docker compose --file docker-compose.test.yml up --exit-code-from sut -t 10
          docker compose --file docker-compose.test.yml down --remove-orphans

          echo '###############################'
          echo "Test (slim) - Moodle update and plugin installation..."
          export TEST_IMAGE_NAME=${{ github.repository }}:latest-slim
          docker compose --file docker-compose.test.yml up --exit-code-from sut -t 10
          export TEST_IMAGE_NAME=${{ steps.meta.outputs.tags }}-slim
          export AUTO_UPDATE_MOODLE=true
          export UPDATE_MOODLE_CODE=true
          docker compose --file docker-compose.test.yml up --exit-code-from sut -t 10
          docker compose --file docker-compose.test.yml down --remove-orphans
          unset AUTO_UPDATE_MOODLE UPDATE_MOODLE_CODE
          unset ARG_ENABLE_GIT_CLONE

      - name: Test build multi-arch
        uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          tags: ${{ steps.meta.outputs.tags }}
          platforms: ${{ vars.CONTAINER_ARCH }}
          provenance: false

      - name: Run Trivy vulnerability scanner for PR
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: ${{ steps.meta.outputs.tags }}
          format: 'table'
          severity: 'CRITICAL,HIGH'
          exit-code: 0
        env:
          TRIVY_DB_REPOSITORY: ghcr.io/aquasecurity/trivy-db,public.ecr.aws/aquasecurity/trivy-db

      - name: Run the Anchore scan for PR
        uses: anchore/scan-action@v6
        id: anchore-scan-pr
        with:
          image: ${{ steps.meta.outputs.tags }}
          output-format: table
          fail-build: false
