name: Build and test PR

on:
  pull_request:
    branches: ["dev"]
    paths-ignore:
      - README.md

jobs:
  prepare:
    outputs:
      tag: ${{ steps.meta.outputs.tags }}
    runs-on: ubuntu-latest
    steps:
      - uses: step-security/harden-runner@v2
        with:
          egress-policy: audit

      - name: Prepare Meta Data
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: |
            ${{ github.repository }}
          tags: |
            type=sha
    
  test:
    strategy:
      fail-fast: false
      matrix:
        test: [standard, slim, multi]
    needs:
      - prepare
    runs-on: ubuntu-latest
    steps:
      - uses: step-security/harden-runner@v2
        with:
          egress-policy: audit

      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up QEMU
        if: matrix.test == 'multi'
        uses: docker/setup-qemu-action@v3

      - name: Set up containerd image store
        if: matrix.test == 'multi'
        uses: docker/setup-docker-action@v4
        with:
          daemon-config: |
            {
              "debug": true,
              "features": {
                "containerd-snapshotter": true
              }
            }

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and Test
        if: matrix.test == 'standard'
        run: |
          echo '###############################'
          echo "Test - build with plugin list and installing Moodle..."
          export TEST_IMAGE_NAME=${{ needs.prepare.outputs.tag }}
          export ARG_MOODLE_PLUGIN_LIST=report_benchmark
          docker compose --file docker-compose.test.yml up --exit-code-from sut -t 10
          docker compose --file docker-compose.test.yml down --remove-orphans

          echo '###############################'
          echo "Test - Moodle update and plugin installation..."
          export TEST_IMAGE_NAME=${{ github.repository }}:latest
          docker compose --file docker-compose.test.yml up --exit-code-from sut -t 10
          export TEST_IMAGE_NAME=${{ needs.prepare.outputs.tag }}
          export AUTO_UPDATE_MOODLE=true
          export UPDATE_MOODLE_CODE=true
          docker compose --file docker-compose.test.yml up --exit-code-from sut -t 10
          docker compose --file docker-compose.test.yml down --remove-orphans
          unset AUTO_UPDATE_MOODLE UPDATE_MOODLE_CODE

      - name: Build and Test (Slim)
        if: matrix.test == 'slim'
        run: |
          echo '###############################'
          echo "Test - build with plugin list and installing Moodle..."
          export TEST_IMAGE_NAME=${{ needs.prepare.outputs.tag }}-slim
          export ARG_MOODLE_PLUGIN_LIST=report_benchmark
          export ARG_ENABLE_GIT_CLONE=false
          docker compose --file docker-compose.test.yml up --exit-code-from sut -t 10
          docker compose --file docker-compose.test.yml down --remove-orphans

          echo '###############################'
          echo "Test - Moodle update and plugin installation..."
          export TEST_IMAGE_NAME=${{ github.repository }}:latest-slim
          docker compose --file docker-compose.test.yml up --exit-code-from sut -t 10
          export TEST_IMAGE_NAME=${{ needs.prepare.outputs.tag }}-slim
          export AUTO_UPDATE_MOODLE=true
          export UPDATE_MOODLE_CODE=true
          docker compose --file docker-compose.test.yml up --exit-code-from sut -t 10
          docker compose --file docker-compose.test.yml down --remove-orphans
          unset AUTO_UPDATE_MOODLE UPDATE_MOODLE_CODE
          unset ARG_ENABLE_GIT_CLONE

      - name: Test build multi-arch
        if: matrix.test == 'multi'
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true # with containerd image store enabled
          tags: ${{ needs.prepare.outputs.tag }}
          platforms: ${{ vars.CONTAINER_ARCH }}
          provenance: false
          #load: true

      - name: Run Trivy vulnerability scanner for PR
        if: matrix.test == 'multi'
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: ${{ needs.prepare.outputs.tag }}
          format: 'table'
          severity: 'CRITICAL,HIGH'
          exit-code: 0
        env:
          TRIVY_DB_REPOSITORY: ghcr.io/aquasecurity/trivy-db,public.ecr.aws/aquasecurity/trivy-db

      - name: Run Anchore scan for PR
        if: matrix.test == 'multi'
        uses: anchore/scan-action@v6
        id: anchore-scan-pr
        with:
          image: ${{ needs.prepare.outputs.tag }}
          output-format: table
          fail-build: false

  final:
    if: always()
    needs: 
      - test
    runs-on: ubuntu-latest
    steps:
      - uses: step-security/harden-runner@v2
        with:
          egress-policy: audit

      - name: Check necessary test status
        uses: re-actors/alls-green@release/v1
        with:
          jobs: ${{ toJSON(needs) }}
