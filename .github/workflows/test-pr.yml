name: Build and test PR

on:
  pull_request:
    branches: ["dev"]
    paths-ignore:
      - README.md

env:
  BASELINE_IMAGE_TAG: latest

jobs:
  prepare:
    outputs:
      tag: ${{ steps.meta.outputs.tags }}
    runs-on: ubuntu-latest
    steps:
      - uses: step-security/harden-runner@aebdcf6156ab6691adf63218240e476564a1ed4c # v2.23.0
        with:
          egress-policy: audit

      - name: Prepare Meta Data
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: |
            localhost:5000/${{ github.repository }}
          tags: |
            type=sha
    
  test:
    strategy:
      fail-fast: false
      matrix:
        test: [standard, slim, multi, volume1, volume2, db-replica]
    needs:
      - prepare
    runs-on: ubuntu-latest
    timeout-minutes: 60
    services:
      registry:
        image: registry:3@sha256:82f6ff4a7f982960c8aa51617fea3aabc485df6e55cce80d22deb1de36f1bc3c
        env:
          REGISTRY_LOG_LEVEL: warn
        ports:
          - 5000:5000
    steps:
      - uses: step-security/harden-runner@aebdcf6156ab6691adf63218240e476564a1ed4c # v2.23.0
        with:
          egress-policy: audit

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up QEMU
        if: matrix.test == 'multi'
        uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0
      - name: Set up Docker Buildx
        if: matrix.test == 'multi'
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
        with:
          driver-opts: network=host

      - name: Test read replica startup readiness
        if: matrix.test == 'db-replica'
        timeout-minutes: 5
        run: bash .github/scripts/test-replica-readiness.sh

      - name: Test Moodle read routing across replica failover
        if: matrix.test == 'db-replica'
        timeout-minutes: 45
        env:
          TEST_IMAGE_NAME: ${{ needs.prepare.outputs.tag }}-replica-test
        run: bash .github/scripts/test-replica-failover.sh

      - name: Build and Test
        if: matrix.test == 'standard'
        run: |
          echo '###############################'
          echo "Test - build with plugin list and installing Moodle..."
          export TEST_IMAGE_NAME=${{ needs.prepare.outputs.tag }}
          export ARG_MOODLE_PLUGIN_LIST=report_benchmark
          docker compose --file docker-compose.test.yml up --exit-code-from sut -t 10
          docker compose --file docker-compose.test.yml down --remove-orphans

          echo '#'
          echo '###############################'
          echo "Test - Moodle update and plugin installation..."
          export TEST_IMAGE_NAME=${{ github.repository }}:${{ env.BASELINE_IMAGE_TAG }}
          docker compose --file docker-compose.test.yml up --exit-code-from sut -t 10
          export TEST_IMAGE_NAME=${{ needs.prepare.outputs.tag }}
          export AUTO_UPDATE_MOODLE=true
          export UPDATE_MOODLE_CODE=true
          docker compose --file docker-compose.test.yml up --exit-code-from sut -t 10
          docker compose --file docker-compose.test.yml down --remove-orphans
          unset AUTO_UPDATE_MOODLE UPDATE_MOODLE_CODE

      - name: Test Bind Volume Mount
        if: matrix.test == 'volume1'
        run: |
          echo '###############################'
          echo "Test - run with bind volume..."
          export LOCAL_PATH='./tmpdata/'"${{ matrix.test }}"
          mkdir -p "${LOCAL_PATH}"/moodledata "${LOCAL_PATH}"/moodlehtml
          chmod -R 777 "${LOCAL_PATH}"
          export ARG_MOODLE_GIT_BRANCH="$(grep '^ARG\s*ARG_MOODLE_GIT_BRANCH=' Dockerfile | cut -d '=' -f 2 | tr -d "'")"
          export ARG_MOODLE_GIT_COMMIT="$(grep '^ARG\s*ARG_MOODLE_GIT_COMMIT=' Dockerfile | cut -d '=' -f 2 | tr -d "'")"
          export TEST_IMAGE_NAME=${{ needs.prepare.outputs.tag }}
          docker compose --file docker-compose.test.volume.yml up --exit-code-from sut -t 10
          docker compose --file docker-compose.test.volume.yml down --remove-orphans
          echo "${LOCAL_PATH}"
          ls -l "${LOCAL_PATH}"

      - name: Test Upgrade with Bind Volume Mount
        if: matrix.test == 'volume2'
        run: |
          echo '###############################'
          echo "Test - Moodle update by Git with volume..."
          export LOCAL_PATH='./tmpdata'"${{ matrix.test }}"
          mkdir -p "${LOCAL_PATH}"/moodledata "${LOCAL_PATH}"/moodlehtml
          chmod -R 777 "${LOCAL_PATH}"
          export TEST_IMAGE_NAME=${{ github.repository }}:${{ env.BASELINE_IMAGE_TAG }}
          #export ARG_MOODLE_GIT_BRANCH='MOODLE_405_STABLE'
          #export ARG_MOODLE_GIT_COMMIT='a57387fe2d8faa2e6fa36246f4dc59825c307e7f'
          #export TEST_IMAGE_NAME=${{ needs.prepare.outputs.tag }}-old
          docker compose --file docker-compose.test.volume.yml up --exit-code-from sut -t 10
          echo "${LOCAL_PATH}"
          ls -l "${LOCAL_PATH}"

          export AUTO_UPDATE_MOODLE=true
          export UPDATE_MOODLE_CODE=true
          export ARG_MOODLE_GIT_BRANCH="$(grep '^ARG\s*ARG_MOODLE_GIT_BRANCH=' Dockerfile | cut -d '=' -f 2 | tr -d "'")"
          export ARG_MOODLE_GIT_COMMIT="$(grep '^ARG\s*ARG_MOODLE_GIT_COMMIT=' Dockerfile | cut -d '=' -f 2 | tr -d "'")"
          export TEST_IMAGE_NAME=${{ needs.prepare.outputs.tag }}
          docker compose --file docker-compose.test.volume.yml up --exit-code-from sut -t 10

          docker compose --file docker-compose.test.volume.yml down --remove-orphans
          unset AUTO_UPDATE_MOODLE UPDATE_MOODLE_CODE
          #rm -rf ./tmpdata #TODO: fix permission denied error

      - name: Build and Test (Slim)
        if: matrix.test == 'slim'
        run: |
          echo '###############################'
          echo "Test - build with plugin list and installing Moodle..."
          export TEST_IMAGE_NAME=${{ needs.prepare.outputs.tag }}-slim
          export ARG_MOODLE_PLUGIN_LIST=report_benchmark
          export ARG_ENABLE_GIT_CLONE=false
          docker compose --file docker-compose.test.yml up --exit-code-from sut -t 10
          docker compose --file docker-compose.test.yml down --remove-orphans

          echo '#'
          echo '###############################'
          echo "Test - Moodle update and plugin installation..."
          export TEST_IMAGE_NAME=${{ github.repository }}:${{ env.BASELINE_IMAGE_TAG }}-slim
          docker compose --file docker-compose.test.yml up --exit-code-from sut -t 10
          export TEST_IMAGE_NAME=${{ needs.prepare.outputs.tag }}-slim
          export AUTO_UPDATE_MOODLE=true
          export UPDATE_MOODLE_CODE=true
          docker compose --file docker-compose.test.yml up --exit-code-from sut -t 10
          docker compose --file docker-compose.test.yml down --remove-orphans
          unset AUTO_UPDATE_MOODLE UPDATE_MOODLE_CODE
          unset ARG_ENABLE_GIT_CLONE

      - name: Test build multi-arch
        if: matrix.test == 'multi'
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          push: true # to local registry
          tags: ${{ needs.prepare.outputs.tag }}
          platforms: ${{ vars.CONTAINER_ARCH }}
          provenance: false

      - name: Run Trivy vulnerability scanner for PR
        if: matrix.test == 'multi'
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: ${{ needs.prepare.outputs.tag }}
          format: 'table'
          severity: 'CRITICAL,HIGH'
          exit-code: 0
        env:
          TRIVY_DB_REPOSITORY: ghcr.io/aquasecurity/trivy-db,public.ecr.aws/aquasecurity/trivy-db

      - name: Run Anchore scan for PR
        if: matrix.test == 'multi'
        uses: anchore/scan-action@11983a512817154c80a9db660c1a184be7513ed6 # v7.4.3
        id: anchore-scan-pr
        with:
          image: ${{ needs.prepare.outputs.tag }}
          output-format: table
          fail-build: false

  final:
    if: always()
    needs:
      - test
    runs-on: ubuntu-latest
    steps:
      - uses: step-security/harden-runner@aebdcf6156ab6691adf63218240e476564a1ed4c # v2.23.0
        with:
          egress-policy: audit

      - name: Check necessary test status
        uses: re-actors/alls-green@b5b5b37504aa4183270bd3d855c52a67f212be35 # v1.3.0
        with:
          jobs: ${{ toJSON(needs) }}
