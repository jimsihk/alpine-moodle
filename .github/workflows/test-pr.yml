name: Build and test PR

on:
  pull_request:
    branches: ["dev"]
    paths-ignore:
      - README.md

env:
  # github.repository as <account>/<repo>
  IMAGE_NAME: ${{ github.repository }}

jobs:
  build-and-test-pr:
    runs-on: ubuntu-latest
    steps:
      - uses: step-security/harden-runner@v2
        with:
          egress-policy: audit

      - name: Checkout
        uses: actions/checkout@v4

      - name: Build and Test
        run: |
          export TEST_IMAGE_NAME=${{ env.IMAGE_NAME }}:${{ github.sha }}
          docker build -t $TEST_IMAGE_NAME \
              --build-arg ARG_MOODLE_PLUGIN_LIST=report_benchmark \
              --build-arg ARG_ALLOW_INCOMPATIBLE_PLUGIN=true .
          docker compose --file docker-compose.test.yml up --exit-code-from sut -t 10

      - name: Slim image
        run: |
          echo "Install Slim..."
          curl -sL https://raw.githubusercontent.com/slimtoolkit/slim/master/scripts/install-slim.sh | sudo -E bash -
          echo "Before:"
          docker image ls -a
          docker image history "${{ env.IMAGE_NAME }}:${{ github.sha }}"

          echo "Trying to slim..."
          slim build --target ${{ env.IMAGE_NAME }}:${{ github.sha }} --http-probe=false
          
          echo "After:"
          docker image ls -a
          docker image history "${{ env.IMAGE_NAME }}.slim:latest"

          echo "Test slim version..."
          export TEST_IMAGE_NAME=${{ env.IMAGE_NAME }}.slim:latest
          docker compose --file docker-compose.test.yml up --exit-code-from sut -t 10

      - name: Set up QEMU
        id: qemu
        uses: docker/setup-qemu-action@v3
        with:
          image: tonistiigi/binfmt:latest
          platforms: all

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
        id: buildx

      - name: Try build multi-arch
        uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          tags: ${{ env.IMAGE_NAME }}:${{ github.sha }}
          platforms: ${{ vars.CONTAINER_ARCH }}
          provenance: false

      - name: Run Trivy vulnerability scanner for PR
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: '${{ env.IMAGE_NAME }}:${{ github.sha }}'
          format: 'table'
          severity: 'CRITICAL,HIGH'
          exit-code: 0
        env:
          TRIVY_DB_REPOSITORY: ghcr.io/aquasecurity/trivy-db,public.ecr.aws/aquasecurity/trivy-db

      - name: Run the Anchore scan action for PR
        uses: anchore/scan-action@v6
        id: anchore-scan-pr
        with:
          image: '${{ env.IMAGE_NAME }}:${{ github.sha }}'
          output-format: table
          fail-build: false
