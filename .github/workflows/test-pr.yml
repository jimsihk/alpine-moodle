name: Build and test PR

on:
  pull_request:
    branches: ["dev"]
    paths-ignore:
      - README.md

env:
  # github.repository as <account>/<repo>
  IMAGE_NAME: ${{ github.repository }}

jobs:
  build-and-test-pr:
    strategy:
      fail-fast: false
      matrix:
        image: [normal, slim]
        os: [24.04, 24.04-arm]
    runs-on: ubuntu-${{ matrix.os }}
    steps:
      - uses: step-security/harden-runner@v2
        with:
          egress-policy: audit

      - name: Setup build parameters
        id: param
        run: |
          if [ "${{ matrix.image }}" == 'slim' ]; then
            echo "git_clone=false" >> $GITHUB_OUTPUT
          else
            echo "git_clone=true" >> $GITHUB_OUTPUT
          fi
          if echo "${{ matrix.os }}" | grep -q "arm$"; then
            echo "multi_arch=false" >> $GITHUB_OUTPUT
          else
            echo "multi_arch=true" >> $GITHUB_OUTPUT
          fi

      - name: Checkout
        uses: actions/checkout@v4

      #- name: Set up QEMU
      #  uses: docker/setup-qemu-action@v3

      #- name: Set up Docker Buildx
      #  uses: docker/setup-buildx-action@v3

      - name: Try build
        uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          tags: ${{ env.IMAGE_NAME }}:${{ github.sha }}
          provenance: false
          load: true
          cache-to: type=gha,mode=max
          build-args: |
            ARG_MOODLE_PLUGIN_LIST=report_benchmark
            ARG_ALLOW_INCOMPATIBLE_PLUGIN=true
            ARG_ENABLE_GIT_CLONE=${{ steps.param.outputs.git_clone }}

      - name: Test
        run: |
          export TEST_IMAGE_NAME=${{ env.IMAGE_NAME }}:${{ github.sha }}
          docker compose --file docker-compose.test.yml up --exit-code-from sut -t 10

      #- name: Try build multi-arch
      #  if: steps.param.outputs.multi_arch == 'true'
      #  uses: docker/build-push-action@v6
      #  with:
      #    context: .
      #    push: false
      #    tags: ${{ env.IMAGE_NAME }}:${{ github.sha }}
      #    platforms: ${{ vars.CONTAINER_ARCH }}
      #    provenance: false
      #    build-args: |
      #      ARG_MOODLE_PLUGIN_LIST=report_benchmark
      #      ARG_ALLOW_INCOMPATIBLE_PLUGIN=true
      #      ARG_ENABLE_GIT_CLONE=${{ steps.param.outputs.git_clone }}
            
      - name: Run Trivy vulnerability scanner for PR
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: '${{ env.IMAGE_NAME }}:${{ github.sha }}'
          format: 'table'
          severity: 'CRITICAL,HIGH'
          exit-code: 0
        env:
          TRIVY_DB_REPOSITORY: ghcr.io/aquasecurity/trivy-db,public.ecr.aws/aquasecurity/trivy-db

      - name: Run the Anchore scan action for PR
        uses: anchore/scan-action@v6
        id: anchore-scan-pr
        with:
          image: '${{ env.IMAGE_NAME }}:${{ github.sha }}'
          output-format: table
          fail-build: false

  test:
    runs-on: ubuntu-latest
    needs: [build-and-test-pr]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Try build multi-arch
        uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          tags: ${{ env.IMAGE_NAME }}:${{ github.sha }}
          platforms: ${{ vars.CONTAINER_ARCH }}
          provenance: false
          cache-from: gha
          build-args: |
            ARG_MOODLE_PLUGIN_LIST=report_benchmark
            ARG_ALLOW_INCOMPATIBLE_PLUGIN=true
            
