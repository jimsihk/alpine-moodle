name: Build and push docker image

on:
  push:
    tags: ['*']
    branches: ["dev"]
    paths-ignore:
      - README.md
      - .github/workflows/update-dockerhub-desc.yml

env:
  IMAGE_REGISTRY: ${{ vars.REGISTRY_PUBLIC }}
  #<account>/<repo>
  IMAGE_NAME: ${{ github.repository }}
  TEST_TAG: test-build

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      - uses: step-security/harden-runner@aebdcf6156ab6691adf63218240e476564a1ed4c # v2
        with:
          egress-policy: audit

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0

      - name: Prepare
        id: prepare
        run: |
          DOCKER_PLATFORMS=${{ vars.CONTAINER_ARCH }}

          VERSION=${GITHUB_REF#refs/*/}
          TAGS="${{ env.IMAGE_NAME }}:${VERSION}"
          TAGS_SLIM="${{ env.IMAGE_NAME }}:${VERSION}-slim"

          if [[ $GITHUB_REF == refs/tags/* ]]; then
            TAGS="$TAGS,${{ env.IMAGE_NAME }}:latest"
            TAGS_SLIM="$TAGS_SLIM,${{ env.IMAGE_NAME }}:latest-slim"
          fi
          
          for TAG in $(echo $TAGS | sed 's/,/ /g'); do
            TAGS="$TAGS,quay.io/$TAG"
            TAGS_SLIM="$TAGS_SLIM,quay.io/$TAG-slim"
          done

          echo "platforms=${DOCKER_PLATFORMS}" >> $GITHUB_OUTPUT
          echo "tags=${TAGS}" >> $GITHUB_OUTPUT
          echo "tags_slim=${TAGS_SLIM}" >> $GITHUB_OUTPUT

      - name: Set up QEMU
        id: qemu
        uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4
        with:
          image: tonistiigi/binfmt:latest
          platforms: all

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4
        id: buildx

      - name: Login to DockerHub
        uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4
        with:
          registry: ${{ env.IMAGE_REGISTRY }}
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Login to Quay.io
        uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4
        with:
          registry: quay.io
          username: ${{ secrets.QUAYIO_USERNAME }}
          password: ${{ secrets.QUAYIO_TOKEN }}

      - name: Build and Test
        run: |
          export TEST_IMAGE_NAME=${{ env.IMAGE_NAME }}:${{ env.TEST_TAG }}
          docker compose --file docker-compose.test.yml up --exit-code-from sut -t 10 --build

      - name: Run Trivy vulnerability scanner
        uses: aquasecurity/trivy-action@38b337fff0a2f984d5be173c99e3f633438167ec # master
        with:
          image-ref: '${{ env.IMAGE_NAME }}:${{ env.TEST_TAG }}'
          format: 'sarif'
          output: 'trivy-results.sarif'
          severity: 'CRITICAL,HIGH'
          exit-code: 0
        env:
          TRIVY_DB_REPOSITORY: ghcr.io/aquasecurity/trivy-db,public.ecr.aws/aquasecurity/trivy-db

      - name: Upload Trivy scan results
        uses: github/codeql-action/upload-sarif@1bd86f2fdb4b86187fa4059f16f31a3202acc9ea # v4
        with:
          sarif_file: 'trivy-results.sarif'

      - name: Run Anchore scan
        uses: anchore/scan-action@e1165082ffb1fe366ebaf02d8526e7c4989ea9d2 # v7
        id: anchore-scan
        with:
          image: '${{ env.IMAGE_NAME }}:${{ env.TEST_TAG }}'
          output-format: sarif
          fail-build: false

      - name: Upload Anchore Scan Report
        uses: github/codeql-action/upload-sarif@1bd86f2fdb4b86187fa4059f16f31a3202acc9ea # v4
        with:
          sarif_file: ${{ steps.anchore-scan.outputs.sarif }}

      - name: Get changed container files
        id: changed-files
        uses: tj-actions/changed-files@24d32ffd492484c1d75e0c0b894501ddb9d30d62 # v47
        with:
          files: |
            rootfs/**
            Dockerfile

      - name: List changed container files
        run: |
          echo "Any container files changed? ${{ steps.changed-files.outputs.any_changed }}"
          echo "Changed files: ${{ steps.changed-files.outputs.all_changed_files }}"

      - name: Build and push
        if: steps.changed-files.outputs.any_changed == 'true'
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7
        with:
          context: .
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.prepare.outputs.tags }}
          platforms: ${{ steps.prepare.outputs.platforms }}
          provenance: false

      - name: Build and push (slim version)
        if: steps.changed-files.outputs.any_changed == 'true'
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7
        with:
          context: .
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.prepare.outputs.tags_slim }}
          platforms: ${{ steps.prepare.outputs.platforms }}
          provenance: false
          build-args: |
            ARG_ENABLE_GIT_CLONE='false'
