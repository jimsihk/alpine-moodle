services:

  postgres:
    image: postgres:alpine@sha256:cac45fb483caee3668946088a1c0532db89d5285c28dbfeac889b4068296e06f
    restart: unless-stopped
    environment:
      - POSTGRES_PASSWORD=moodle
      - POSTGRES_USER=moodle
      - POSTGRES_DB=moodle
    volumes:
      - postgres:/var/lib/postgresql/data

  redis:
    image: redis/redis-stack-server@sha256:798ab84d9f266936b034ab11c4d04a2b8e4b441884c5aa7d17ac951eefdf742a
    restart: unless-stopped
    volumes:
      - redis:/data

  moodle:
    image: jimsihk/alpine-moodle@sha256:683e6ee5a25f91c0ff6abfa5ecbf919efa7cf434b967113eaf70b2a9877871bb
    restart: unless-stopped
    deploy:
      replicas: 2
    environment:
      - LANG=en_US.UTF-8
      - LANGUAGE=en_US:en
      - SITE_URL=https://localhost
      - DB_TYPE=pgsql
      - DB_HOST=postgres
      - DB_PORT=5432
      - DB_NAME=moodle
      - DB_USER=moodle
      - DB_PASS=moodle
      - DB_PREFIX=mdl_
      - SSLPROXY=true
      - MOODLE_EMAIL=user@example.com
      - MOODLE_LANGUAGE=en
      - MOODLE_SITENAME=New-Site
      - MOODLE_USERNAME=moodleuser
      - MOODLE_PASSWORD=PLEASE_CHANGEME
      - SMTP_HOST=smtp.gmail.com
      - SMTP_PORT=587
      - SMTP_USER=your_email@gmail.com
      - SMTP_PASSWORD=your_password
      - SMTP_PROTOCOL=tls
      - MOODLE_MAIL_NOREPLY_ADDRESS=noreply@localhost
      - MOODLE_MAIL_PREFIX=[moodle]
      - AUTO_UPDATE_MOODLE=true
      # not suggest to enable auto update Moodle core code as it may 
      #   cause discrepancy between code and database, alternatively
      #   may start with 1 replica and then scale up after successfully
      #   deploy and update
      - UPDATE_MOODLE_CODE=false
      # uncomment below to define the session cache upon installation
      #   note: config.php will need to be changed when reverting this config
#      - SESSION_CACHE_TYPE=redis
#      - SESSION_CACHE_HOST=redis
#      - SESSION_CACHE_PORT=6379
#      - SESSION_CACHE_PREFIX=mdl
    volumes:
      - moodledata:/var/www/moodledata
    depends_on:
      - postgres
      - redis

  loadbalancer:
    image: nginx@sha256:6a3df739b6312289e87d70947d900669c1b3087474ece5814b9c01bbf2e6dde3
    volumes:
      - ./nginx-lb.conf:/etc/nginx/nginx.conf:ro
      - ./https.crt:/etc/nginx/ssl/default.crt:ro
      - ./https.key:/etc/nginx/ssl/default.key:ro
    ports:
      - "80:80"
      - "443:443"
    depends_on:
      - moodle

volumes:
  postgres: null
  moodledata: null
  redis: null
