    # This passes 404 pages to Moodle so they can be themed while preserving the
    # original 404 status required by Moodle router checks.
    error_page 404 =404 /error/index.php;
    error_page 403 =404 /error/index.php;

    # Send routed requests to r.php via an internal rewrite so PHP executes it
    # instead of serving the file statically through try_files.
    location @moodle_router {
        rewrite ^ /r.php last;
    }

    # Route legacy /lib/*.php shims through Moodle when the public shim no longer
    # exists while still allowing existing PHP files to execute normally.
    location ~ ^/lib/.*\.php(/|$) {
        fastcgi_split_path_info ^(.+\.php)(/.+)$;
        if (!-f $document_root$fastcgi_script_name) {
            rewrite ^ /r.php last;
        }
        fastcgi_pass unix:/run/php-fpm.sock;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        fastcgi_param SCRIPT_NAME $fastcgi_script_name;
        fastcgi_param PATH_INFO $fastcgi_path_info;
        fastcgi_index index.php;
        include fastcgi_params;

        # Pass the original forwarded scheme and HTTPS status through the shared
        # server-level variables defined in the base nginx template.
        fastcgi_param HTTP_X_FORWARDED_PROTO $forwarded_scheme;
        fastcgi_param HTTPS $https if_not_empty;
    }

    # Route clean URLs without file extensions through the Moodle router while
    # still serving existing files and directories directly.
    location ~ ^/(?!$)(?:[^./]+/)*[^./]*$ {
        try_files $uri $uri/ @moodle_router;
    }

    # Hide all dot files but allow "Well-Known URIs" as per RFC 5785
    location ~ /\.(?!well-known).* {
        return 404;
    }

    # Don't allow direct access to various internal files. See MDL-69333
    location ~ (/vendor/|/node_modules/|composer\.json|/readme|/README|readme\.txt|README\.txt|upgrade\.txt|UPGRADING\.md|UPGRADING\-CURRENT\.md|db/install\.xml|/fixtures/|/behat/|phpunit\.xml|\.lock|environment\.xml|doesnotexist|CHANGELOG|CHANGELOG\.md|TRADEMARK\.txt|PULL_REQUEST_TEMPLATE\.txt|INSTALL\.txt|CONTRIBUTING\.txt|behat\.yml\.dist|phpunit\.xml\.dist|package\.json|npm-shrinkwrap\.json|security\.txt|index\.php\.inc) {
        deny all;
        return 404;
    }
    
    # Offload the file serving from PHP process as per https://docs.moodle.org/404/en/Nginx#XSendfile_aka_X-Accel-Redirect
    # Adjust based on https://moodle.org/mod/forum/discuss.php?d=413492#p1715955 to fix broken images
    location ~ ^/dataroot/(.*)$ {
        internal;
        alias /var/www/moodledata/$1;
    }
