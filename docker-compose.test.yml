services:
  app:
    image: ${TEST_IMAGE_NAME:-jimsihk/alpine-moodle:local}
    build:
      context: .
      args:
        - ARG_MOODLE_PLUGIN_LIST=${ARG_MOODLE_PLUGIN_LIST}
        - ARG_ALLOW_INCOMPATIBLE_PLUGIN=true
        - ARG_ENABLE_GIT_CLONE=${ARG_ENABLE_GIT_CLONE:-true}
    environment:
      - SITE_URL=http://app:8080
      - MOODLE_SITENAME=Dockerized_Moodle
      - MOODLE_USERNAME=${MOODLE_USERNAME:-moodleuser}
      - MOODLE_PASSWORD=${MOODLE_PASSWORD:-PLEASE_CHANGEME}
      - SESSION_CACHE_TYPE=redis
      - SESSION_CACHE_HOST=redis
      - SESSION_CACHE_PORT=6379
      - AUTO_UPDATE_MOODLE=${AUTO_UPDATE_MOODLE:-false}
      - UPDATE_MOODLE_CODE=${UPDATE_MOODLE_CODE:-false}
      - DB_TYPE=pgsql
      - DB_HOST=pgbouncer
      - DB_PORT=5432
      - DB_NAME=moodle
      - DB_USER=moodledbuser
      - DB_PASS=moodledbpass
      - DB_DBHANDLEOPTIONS=true
      - DB_FETCHBUFFERSIZE=0
      - DB_DBPERSIST=true
    depends_on:
      - postgres
      - redis
      - pgbouncer

  postgres:
    image: postgres:17@sha256:97fb53376be3e4fb1a8a61421daa69dcc3bf2fa39bda3259f5245f9a455af1a9
    environment:
      - POSTGRES_PASSWORD=moodledbpass
      - POSTGRES_USER=moodledbuser
      - POSTGRES_DB=moodle

  pgbouncer:
    image: edoburu/pgbouncer:latest@sha256:8638aa563607256d3c7440437534195f1066a92b68015d89ae9d6b935b444a6d
    environment:
      - DB_USER=moodledbuser
      - DB_PASSWORD=moodledbpass
      - DB_HOST=postgres
      - DB_NAME=moodle
      - AUTH_TYPE=scram-sha-256
      - POOL_MODE=session
      - IGNORE_STARTUP_PARAMETERS=options,extra_float_digits
    depends_on:
      - postgres

  redis:
    image: redis/redis-stack-server@sha256:798ab84d9f266936b034ab11c4d04a2b8e4b441884c5aa7d17ac951eefdf742a

  sut:
    image: alpine:latest@sha256:f59abe656b692d901e184be3445e084786602108599d2a51d229c0f5a48c71bf
    depends_on:
      - app
    command: sh -c "apk add --no-cache python3 && /tmp/run_tests.sh"
    environment:
      - MOODLE_USERNAME=${MOODLE_USERNAME:-moodleuser}
      - MOODLE_PASSWORD=${MOODLE_PASSWORD:-PLEASE_CHANGEME}
    volumes:
      - "./run_tests.sh:/tmp/run_tests.sh:ro"
      - "./run_tests.py:/tmp/run_tests.py:ro"

